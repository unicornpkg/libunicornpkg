version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "ts-types"
    schedule:
      interval: "monthly"
    groups:
      ts-types:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      docs:
        patterns:
          - "*"
  - package-ecosystem: "gitsubmodule"
    directory: "vendor"
    schedule:
      interval: "weekly"
